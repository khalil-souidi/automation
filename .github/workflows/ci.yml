name: QA Automation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1-5"   # nightly, du lundi au vendredi à 06:00 UTC
  workflow_dispatch:
    inputs:
      tags:
        description: "Tag Cucumber à lancer (ex : @smoke)"
        required: false
        default: ""

jobs:
  api-restassured:
    name: API - RestAssured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test -Papi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restassured-report
          path: target/surefire-reports/

  api-postman:
    name: API - Postman/Newman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g newman newman-reporter-htmlextra
      - run: |
          mkdir -p target
          newman run postman/restful-booker.postman_collection.json \
            -e postman/env.postman_environment.json \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export target/newman-report.xml \
            --reporter-htmlextra-export target/newman-report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: target/newman-report.*

  ui-cucumber:
    name: UI - Cucumber/Selenium
    runs-on: ubuntu-latest
    needs: [api-restassured]   # l'UI ne tourne que si l'API est verte (pyramide des tests)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run Cucumber
        run: |
          TAGS="${{ github.event.inputs.tags }}"
          if [ -n "$TAGS" ]; then
            mvn -B test -Pui -Dheadless=true -Dcucumber.filter.tags="$TAGS"
          else
            mvn -B test -Pui -Dheadless=true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: |
            target/cucumber-report.html
            target/cucumber.json
